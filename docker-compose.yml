services:
  mysql:
    image: mysql:8.0
    container_name: wa_blast_mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root_secure_password_2026
      MYSQL_DATABASE: wa_blast_pro
      MYSQL_USER: wa_blast_user
      MYSQL_PASSWORD: wa_blast_secure_password_2026
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/src/database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - wa_blast_network

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: wa_blast_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      JWT_SECRET: wa_blast_super_secret_production_key_2026
      DB_CLIENT: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: wa_blast_user
      DB_PASSWORD: wa_blast_secure_password_2026
      DB_NAME: wa_blast_pro
      DATA_DIR: /app/data
      UPLOAD_DIR: /app/data/uploads
      SESSIONS_DIR: /app/data/sessions
      WA_USE_MOCK: "false"
    volumes:
      - ./backend/data/sessions:/app/data/sessions
      - ./backend/data/uploads:/app/data/uploads
    networks:
      - wa_blast_network

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: wa_blast_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - wa_blast_network

volumes:
  mysql_data:

networks:
  wa_blast_network:
    driver: bridge
